<!DOCTYPE html>
<html>
<head>
    <title>Solar Panel</title>
    <link rel="stylesheet" href="style.css">

    <script>
        function validate() {
            let panel = document.getElementById("panel_id").value;
            let date = document.getElementById("log_date").value;
            let kwh = document.getElementById("kwh").value;

            if (panel == "" || date == "" || kwh == "") {
                alert("Please fill all Details");
                return false;
            }

            if (kwh < 0) {
                alert("Please enter valid Units");
                return false;
            }

            return true;
        }
    </script>
</head>

<body>

<div class="container">

    <h1>Solar Panel Output Log Entry</h1>

    <form action="SolarServlet" method="post"
          onsubmit="return validate();">

        <label><b>Panel ID</b></label>
        <input type="text" id="panel_id"
               name="panel_id" required>
        <br>

        <label><b>Date</b></label>
        <input type="date" id="log_date"
               name="log_date" required>
        <br>

        <label><b>Units (kWh)</b></label>
        <input type="number" id="kwh"
               name="kwh" min="0"
               step="0.01" required>

        <br><br>

        <button type="submit">Save</button>

    </form>
</div>

</body>
</html>
